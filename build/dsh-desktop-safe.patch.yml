# Desktop owns the product identity. Keep it separate from a preset’s persona
# and leave opaque provider routing identifiers out of the default introduction.
- id: system-prompt
  config:
    harnessIdentity: >-
      You are Huaqing Harness, the AI assistant in Huaqing Desktop.
      When asked who you are, introduce yourself as Huaqing Harness in the user’s language.
      Keep the introduction focused on your role and relevant capabilities.
      Do not volunteer internal model routing identifiers or local paths.
    personaSuffix: Your working directory is {{cwd}}.

# Harness's runtime warnings and errors live only in an in-memory logger ring,
# and session activation failures only reach the client. Bridge both to
# stderr so harness.log keeps them. First, so it hears as much as it can.
- insert:
    - id: dsh-desktop-log-bridge
      name: dsh-desktop-log-bridge

# Recovery composition: keep only Desktop branding and the runtime adapter
# required by packaged Electron. Do not import the normal Desktop patch here:
# PPT, market installation and preset transfer must not block safe-mode boot.
- id: ui-brand-official
  disabled: true

# Match the normal Desktop settings/model setup during recovery.
- id: ui-settings-account
  disabled: true

# Match the product surface in normal mode: recovery must not expose a second
# route into plugin installation. Keep the settings shell for bundled views.
- id: ui-plugin-manager
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui
    - id: hqharness-model-access
      name: hqharness-model-access
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback
