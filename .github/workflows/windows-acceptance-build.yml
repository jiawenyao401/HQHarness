name: Build and qualify HQHarness Windows acceptance installer

on:
  workflow_call:
    inputs:
      draft_delivery:
        type: boolean
        default: false
      xasp_bundle:
        type: boolean
        default: false
    secrets:
      XASP_CHECKOUT_TOKEN:
        description: Read-only contents access to hqzyai/xasp for opted-in private XASP packages
        required: false
      XASP_CHECKOUT_KEY:
        description: Private SSH key for a read-only deploy key on hqzyai/xasp
        required: false

# The caller supplies contents:read for normal builds and contents:write only
# for an explicitly requested manual private draft delivery.
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require private draft delivery for XASP
        if: inputs.xasp_bundle && !inputs.draft_delivery
        shell: pwsh
        run: throw 'XASP bundles require draft_delivery in the private HQHarness repository.'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      # Bumping the app version changes the lockfile hash even when its dependencies are identical.
      - name: Locate npm cache for fallback restore
        if: steps.node.outputs.cache-hit != 'true'
        id: npm-cache
        shell: pwsh
        run: |
          $directory = npm config get cache
          if ($LASTEXITCODE -ne 0 -or -not $directory) { throw 'Could not locate the npm cache.' }
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        if: steps.node.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: node-cache-Windows-x64-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: node-cache-Windows-x64-npm-
      - name: Verify private draft delivery destination
        if: inputs.draft_delivery
        env:
          GH_TOKEN: ${{ github.token }}
          HQHARNESS_DRAFT_DELIVERY: 'true'
        run: node .github/scripts/deliver-windows-acceptance-draft.mjs --check
      - name: Prepare pinned private XASP input
        if: inputs.xasp_bundle
        uses: ./.github/actions/prepare-private-xasp
        with:
          read-token: ${{ secrets.XASP_CHECKOUT_TOKEN }}
          read-key: ${{ secrets.XASP_CHECKOUT_KEY }}
      - name: Check native build disk space
        shell: pwsh
        run: |
          $disk = Get-PSDrive -Name C
          Write-Host ('Available disk: {0:N1} GiB' -f ($disk.Free / 1GB))
          if ($disk.Free -lt 50GB) {
            Write-Host 'Fresh runner: no task cache to reclaim. Budget: 12 GiB for npm, Office/PPT staging, tests and installer.'
          }
          if ($disk.Free -lt 12GB) { throw 'Insufficient disk space for the 12 GiB task build budget.' }
      - run: npm ci
      - run: npm run typecheck
      - name: Check Git Bash signing fixture path compatibility
        run: npx --no-install vitest run test/signed-test-build.test.ts
      - name: Verify structured browser plans in real Electron
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build/automation-acceptance | Out-Null
          node scripts/automation-performance-smoke.mjs 2>&1 | Tee-Object -FilePath .build/automation-acceptance/browser-local-execution.log
          if ($LASTEXITCODE -ne 0) { throw 'Structured browser local-execution acceptance failed.' }
      - name: Verify native Windows UIA plans against an owned WinForms application
        shell: pwsh
        run: |
          node scripts/automation-window-smoke.mjs 2>&1 | Tee-Object -FilePath .build/automation-acceptance/windows-uia-local-execution.log
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows UIA local-execution acceptance failed.' }
      - name: Run all regression tests
        env:
          XASP_TEST_WORKFLOW_CONFIG: ${{ inputs.xasp_bundle && vars.XASP_TEST_WORKFLOW_CONFIG || '' }}
        run: npm test -- --maxWorkers=4
      - name: Qualify Windows native binaries and real Agent tool execution
        run: node scripts/automation-native-package-smoke.mjs
      - name: Verify actual native authorization timeout and retry
        run: node scripts/automation-consent-smoke.mjs
      - name: Build unsigned acceptance installer on Windows
        shell: pwsh
        env:
          XASP_TEST_WORKFLOW_CONFIG: ${{ inputs.xasp_bundle && vars.XASP_TEST_WORKFLOW_CONFIG || '' }}
        run: npm run package:win
      - name: Verify SDK and real Agent tools from the actual packaged dependency closure
        shell: pwsh
        run: node scripts/automation-native-package-smoke.mjs 'dist/win-unpacked/HQHarness.exe' 'dist/win-unpacked/resources/app.asar'
      - name: Verify default Documents installation and workspace retention
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -File -Filter 'Huaqing-Desktop-*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one acceptance installer.' }
          ./scripts/smoke-windows-documents-install.ps1 -Installer ($installers[0].FullName) -VerifyXasp:($env:XASP_REQUIRE_BUNDLE -eq '1')
      - name: Record exact artifact identity and outstanding manual acceptance
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist -File -Filter 'Huaqing-Desktop-*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one acceptance installer.' }
          $installer = $installer[0]
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $automation = Get-Content packages/hqharness-automation/package.json -Raw | ConvertFrom-Json
          $packaged = Get-Item 'dist/win-unpacked/HQHarness.exe'
          if ($packaged.VersionInfo.ProductName -ne $manifest.build.productName) { throw 'Packaged Windows product display name differs from the configured brand.' }
          [ordered]@{
            version = $manifest.version
            productName = $packaged.VersionInfo.ProductName
            executableName = $packaged.Name
            source = '${{ github.sha }}'
            automationVersion = $automation.version
            actualAgentToolExecution = 'passed'
            nativeSessionRecovery = 'passed (SDK lifecycle; installed UI pending)'
            nativeConsentTimeoutAndRetry = 'passed (actual Electron dialogs; installed UI pending)'
            losslessScreenshotOutput = 'passed'
            automationHistoryPruning = 'passed (actual ASAR helper, services and Agent pre-step; original history and semantic rows preserved)'
            automationToolRouting = 'passed (actual ASAR guard; web/file preference, explicit user override, next-turn reset and Agent isolation)'
            automationPtcRouting = 'passed (actual ASAR real Node PTC; controlled GUI binding; refused-input script blocking; explicit new-turn override and reset)'
            structuredBrowserLocalExecution = 'passed (real Electron owned page; no model requests)'
            nativeWindowsUiaLocalExecution = 'passed (owned WinForms application; background click while keeper holds foreground, exactly-once double-click activation, real UIA text value and click handler verified; no model requests)'
            localExecutionTimingEvidence = 'stage timings and image counts in the native acceptance logs delivered with this installer'
            endToEndModelSpeedup = 'not measured; local fixture timing is not model or classroom latency'
            file = $installer.Name
            sha256 = $hash.Hash.ToLowerInvariant()
            signed = $false
            documentsInstall = 'passed (native Windows default path, upgrade and uninstall preserve the sibling workspace)'
            xaspRuntime = $(if ($env:XASP_REQUIRE_BUNDLE -eq '1') {
              [ordered]@{
                revision = (Get-Content scripts/xasp-runtime/lock.json -Raw | ConvertFrom-Json).revision
                installedVerification = 'passed (native Python, local business checks, multipart transport fixture and journal locking)'
                installedActivation = 'passed (isolated installed desktop, authenticated skill catalog, registered client scripts and visible OA originals button)'
                liveOaTest = 'pending user acceptance'
              }
            } else { $null })
            installedApp = 'pending user acceptance'
            computerInput = 'pending user acceptance'
            browserUse = 'pending user acceptance'
          } | ConvertTo-Json | Set-Content dist/windows-acceptance.json -Encoding utf8
      - name: Deliver verified installer to a private draft
        if: inputs.draft_delivery
        env:
          GH_TOKEN: ${{ github.token }}
          HQHARNESS_DRAFT_DELIVERY: 'true'
        run: node .github/scripts/deliver-windows-acceptance-draft.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.draft_delivery && !inputs.xasp_bundle }}
        with:
          name: hqharness-windows-x64-acceptance
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/Huaqing-Desktop-*.exe
            dist/windows-acceptance.json
      - name: Preserve native automation acceptance logs
        if: ${{ always() && !inputs.draft_delivery && !inputs.xasp_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: hqharness-windows-automation-acceptance-logs
          retention-days: 14
          if-no-files-found: warn
          path: .build/automation-acceptance/*.log
      - name: Preserve installer diagnostics on a failed build
        if: ${{ failure() && !inputs.draft_delivery && !inputs.xasp_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: hqharness-windows-failed-build-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/windows-acceptance.json

# Both delivery modes run the same full native qualification. This unsigned
# acceptance installer still requires installed-app acceptance and signing
# qualification before formal distribution.
