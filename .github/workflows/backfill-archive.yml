name: HQHarness release archive backup

# Explicitly back up assets from this fork's configured GitHub repository.
# The durable release remains on GitHub. This workflow has no external uploader.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing HQHarness release tag to back up (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hqharness-archive-backup
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate HQHarness archive identity
        env:
          RELEASE_MODE: backfill
        run: node .github/scripts/validate-release-config.mjs
      - run: npm ci --ignore-scripts
      - name: Download and validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::tag must contain a semver version"
            exit 1
          }
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*'
          node scripts/verify-release-assets.mjs release-assets "$version"
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hqharness-release-backup-${{ github.run_id }}
          path: release-assets/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
