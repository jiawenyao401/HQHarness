name: HQHarness Windows acceptance installer

on:
  push:
    branches:
      - codex/hqharness-automation
  workflow_dispatch:
    inputs:
      draft_delivery:
        description: Deliver to a private draft when Actions artifact quota is unavailable
        type: boolean
        default: false
      xasp_bundle:
        description: Include the private XASP OA TEST runtime (requires private draft delivery)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hqharness-windows-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft_delivery }}
    permissions:
      contents: read
    uses: ./.github/workflows/windows-acceptance-build.yml
    with:
      draft_delivery: false
      xasp_bundle: ${{ github.event_name == 'workflow_dispatch' && inputs.xasp_bundle }}

  windows-draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_delivery }}
    permissions:
      contents: write
    uses: ./.github/workflows/windows-acceptance-build.yml
    with:
      draft_delivery: true
      xasp_bundle: ${{ inputs.xasp_bundle }}
    secrets:
      XASP_CHECKOUT_TOKEN: ${{ secrets.XASP_CHECKOUT_TOKEN }}
      XASP_CHECKOUT_KEY: ${{ secrets.XASP_CHECKOUT_KEY }}
