name: HQHarness desktop installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      mode:
        description: development=unsigned Dev; signed=signed validation artifacts; resign=sign existing unsigned artifact; prerelease=publish to configured HQ repository; smoke=check signed artifact
        required: false
        default: development
        type: choice
        options:
          - development
          - signed
          - resign
          - prerelease
          - smoke
      prerelease_tag:
        description: Non-v semver tag for prerelease mode (e.g. 2.1.0-rc.1)
        required: false
        type: string
      signed_version:
        description: Non-v semver used only by signed mode (e.g. 0.9.2-test.1)
        required: false
        type: string
      smoke_run_id:
        description: Release run ID containing an existing signed windows-x64 artifact (smoke mode)
        required: false
        type: string
      unsigned_run_id:
        description: Release run ID containing an existing windows-x64-unsigned artifact (resign mode)
        required: false
        type: string
      xasp_bundle:
        description: Include the private XASP OA TEST runtime in a signed or prerelease build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Platform-only retries have independent artifacts and never publish.
  group: hqharness-release-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate dispatch inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          SIGNED_VERSION: ${{ inputs.signed_version }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
          UNSIGNED_RUN_ID: ${{ inputs.unsigned_run_id }}
        run: |
          set -euo pipefail
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          case "$MODE" in
            prerelease)
              if [ -z "${PRERELEASE_TAG:-}" ]; then
                echo "::error::prerelease mode requires prerelease_tag"
                exit 1
              fi
              if [[ "$PRERELEASE_TAG" == v* ]] || ! [[ "$PRERELEASE_TAG" =~ $semver_re ]]; then
                echo "::error::prerelease_tag must be a non-v semver (e.g. 2.1.0-rc.1)"
                exit 1
              fi
              if [ "$TARGET" != "all" ]; then
                echo "::notice::target=$TARGET with prerelease mode will sign only and skip GitHub publication"
              fi
              ;;
            signed|resign)
              if [ -z "${SIGNED_VERSION:-}" ]; then
                echo "::error::signed mode requires signed_version"
                exit 1
              fi
              if [[ "$SIGNED_VERSION" == v* ]] || ! [[ "$SIGNED_VERSION" =~ $semver_re ]]; then
                echo "::error::signed_version must be a non-v semver (e.g. 0.9.2-test.1)"
                exit 1
              fi
              if [ "$MODE" = 'resign' ] && { [ "$TARGET" != 'windows' ] || ! [[ "$UNSIGNED_RUN_ID" =~ ^[0-9]+$ ]]; }; then
                echo "::error::resign mode requires target=windows and a numeric unsigned_run_id"
                exit 1
              fi
              ;;
            smoke)
              if [ "$TARGET" != 'windows' ] || ! [[ "$SMOKE_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::smoke mode requires target=windows and a numeric smoke_run_id"
                exit 1
              fi
              ;;
            development|'')
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
      - name: Skip validation for tag and pull_request
        if: github.event_name != 'workflow_dispatch'
        run: echo "No dispatch inputs to validate."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate HQHarness release identity
        env:
          RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || inputs.mode || 'development' }}
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
          HQHARN_WINDOWS_PUBLISHER_NAME: ${{ vars.HQHARN_WINDOWS_PUBLISHER_NAME }}
        run: node .github/scripts/validate-release-config.mjs
      - name: Verify private XASP release destination
        if: github.event_name == 'workflow_dispatch' && inputs.xasp_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || inputs.mode }}
        run: node .github/scripts/xasp-ci.mjs verify-private-release

  macos:
    name: macOS ${{ matrix.label }}
    needs: validate-dispatch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.mode != 'smoke' && inputs.mode != 'resign' &&
        (inputs.target == 'all' || inputs.target == 'macos'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple Silicon
            runner: macos-15
            app-directory: mac-arm64
            artifact: macos-apple-silicon
          - arch: x64
            label: Intel
            runner: macos-15-intel
            app-directory: mac
            artifact: macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.prerelease_tag != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.prerelease_tag }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && inputs.signed_version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.signed_version }}"
      - name: Prepare pinned private XASP input
        if: github.event_name == 'workflow_dispatch' && inputs.xasp_bundle
        uses: ./.github/actions/prepare-private-xasp
        with:
          read-token: ${{ secrets.XASP_CHECKOUT_TOKEN }}
          read-key: ${{ secrets.XASP_CHECKOUT_KEY }}
      - run: npm ci
      - run: npm run build
        env:
          XASP_TEST_WORKFLOW_CONFIG: ${{ inputs.xasp_bundle && vars.XASP_TEST_WORKFLOW_CONFIG || '' }}
      - run: npx --no-install vitest run
      - name: Verify built-in automation in native Chromium
        run: npm run test:automation:native
        timeout-minutes: 3
      - name: Verify PPT generation leaves tracked sources clean
        run: git diff --exit-code -- packages/ppt-runtime scripts/ppt
      - run: npm run typecheck
      - name: Validate Apple release secrets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_LINK: ${{ secrets.HQHARN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.HQHARN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.HQHARN_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.HQHARN_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HQHARN_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.HQHARN_APPLE_TEAM_ID }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.HQHARN_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.HQHARN_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HQHARN_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.HQHARN_APPLE_TEAM_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.HQHARN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.HQHARN_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed ${{ matrix.label }} package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: node scripts/verify-target.mjs darwin ${{ matrix.arch }} && npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Build isolated ${{ matrix.label }} development package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/verify-target.mjs darwin ${{ matrix.arch }} && npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.dev.cjs
      - name: Preserve ${{ matrix.label }} update metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: |
          if [ -f dist/latest-mac.yml ]; then
            mv dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml
          fi
      - name: Sign, notarize, and staple ${{ matrix.label }} DMG
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          dmg_path="dist/hqharness-mac-${{ matrix.arch }}.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::Developer ID Application identity not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --no-s3-acceleration
          xcrun stapler staple "$dmg_path"
      - name: Remove temporary signing keychain
        if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease')))
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "$APPLE_API_KEY" || rm -f "$APPLE_API_KEY"
      - name: Verify signed and notarized ${{ matrix.label }} app
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: |
          app_path="dist/${{ matrix.app-directory }}/HQHarness.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=2 dist/hqharness-mac-${{ matrix.arch }}.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/hqharness-mac-${{ matrix.arch }}.dmg
          xcrun stapler validate dist/hqharness-mac-${{ matrix.arch }}.dmg
      - name: Verify OA desktop from the signed macOS installer
        if: github.event_name == 'workflow_dispatch' && inputs.xasp_bundle
        run: |
          set -euo pipefail
          mountpoint=$(mktemp -d "$RUNNER_TEMP/hqharness-xasp.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" dist/hqharness-mac-${{ matrix.arch }}.dmg
          trap 'hdiutil detach "$mountpoint" && rmdir "$mountpoint"' EXIT
          node scripts/xasp-runtime/verify-installed.mjs "$mountpoint/HQHarness.app/Contents/MacOS/HQHarness"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            dist/hqharness-mac-${{ matrix.arch }}.dmg
            dist/hqharness-mac-${{ matrix.arch }}.zip
            dist/hqharness-mac-${{ matrix.arch }}.zip.blockmap
            dist/latest-mac-${{ matrix.arch }}.yml
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        with:
          name: ${{ matrix.artifact }}-dev
          retention-days: 3
          path: |
            dist-dev/hqharness-dev-mac-${{ matrix.arch }}.dmg
            dist-dev/hqharness-dev-mac-${{ matrix.arch }}.zip
            dist-dev/hqharness-dev-mac-${{ matrix.arch }}.zip.blockmap
          compression-level: 0
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    needs: validate-dispatch
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.mode != 'smoke' && inputs.mode != 'resign' &&
        (inputs.target == 'all' || inputs.target == 'windows'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.prerelease_tag != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.prerelease_tag }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && inputs.signed_version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.signed_version }}"
      - name: Prepare pinned private XASP input
        if: github.event_name == 'workflow_dispatch' && inputs.xasp_bundle
        uses: ./.github/actions/prepare-private-xasp
        with:
          read-token: ${{ secrets.XASP_CHECKOUT_TOKEN }}
          read-key: ${{ secrets.XASP_CHECKOUT_KEY }}
      - run: npm ci
      - run: npm run build
        env:
          XASP_TEST_WORKFLOW_CONFIG: ${{ inputs.xasp_bundle && vars.XASP_TEST_WORKFLOW_CONFIG || '' }}
      - name: Run Windows tests with progress
        run: npx --no-install vitest run --reporter=verbose
        timeout-minutes: 15
      - name: Verify PPT generation leaves tracked sources clean
        run: git diff --exit-code -- packages/ppt-runtime scripts/ppt
      - run: npm run typecheck
      - name: Boot Harness through Electron Node mode on Windows
        run: node scripts/probe-electron-node-runtime.mjs
        timeout-minutes: 5
      - name: Verify Browser Use and real Windows desktop input
        env:
          HQ_AUTOMATION_REQUIRE_INPUT: '1'
        run: npm run test:automation:native
        timeout-minutes: 3
      - name: Check recovery UI on native Windows at three display scales
        run: node scripts/check-recovery-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-recovery-ui
          retention-days: 7
          path: |
            artifacts/recovery-ui/scale-*/*.png
            artifacts/recovery-ui/scale-*/results.json
          if-no-files-found: warn
      - name: Build Windows release package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: node scripts/verify-target.mjs win32 x64 && node scripts/electron-builder-windows.mjs --win --x64 --publish never
      - name: Build isolated Windows development package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        run: node scripts/verify-target.mjs win32 x64 && node scripts/electron-builder-windows.mjs --win --x64 --publish never --config electron-builder.dev.cjs
      - name: Smoke test packaged Windows Harness
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          SMOKE_EXE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && 'dist\win-unpacked\HQHarness.exe' || 'dist-dev\win-unpacked\HQHarness Dev.exe' }}
          SMOKE_USERDATA: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && 'hqharness' || 'hqharness-dev' }}
        run: |
          $userData = Join-Path $env:APPDATA $env:SMOKE_USERDATA
          $logPath = Join-Path $userData 'logs\harness.log'
          # Run outside the checkout: otherwise Node can silently resolve a
          # missing packaged dependency from the repository's node_modules.
          $sourceExecutable = Get-Item $env:SMOKE_EXE
          $isolatedApp = Join-Path $env:RUNNER_TEMP ('DSH packaged smoke ' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $isolatedApp | Out-Null
          Copy-Item -Path (Join-Path $sourceExecutable.Directory.FullName '*') -Destination $isolatedApp -Recurse
          $executable = Join-Path $isolatedApp $sourceExecutable.Name
          $desktopStdout = Join-Path $env:RUNNER_TEMP 'dsh-packaged-desktop.stdout.log'
          $desktopStderr = Join-Path $env:RUNNER_TEMP 'dsh-packaged-desktop.stderr.log'
          $packagedNode = Join-Path $isolatedApp 'resources\app.asar.unpacked\node_modules\node\bin\node.exe'
          if (Test-Path $packagedNode) { throw 'Standalone Windows node.exe must not be packaged.' }
          # Exercise the actual native binding too; the best-effort fallback
          # must not hide a missing or broken packaged koffi dependency.
          # A Windows GUI-subsystem executable makes PowerShell's '&' return
          # before the Node-mode child exits, leaving $LASTEXITCODE unset.
          function Invoke-ElectronNode([string[]]$nodeArguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($executable)
            $start.WorkingDirectory = $isolatedApp
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment['ELECTRON_RUN_AS_NODE'] = '1'
            foreach ($argument in $nodeArguments) { [void]$start.ArgumentList.Add($argument) }
            $child = [System.Diagnostics.Process]::Start($start)
            $stdout = $child.StandardOutput.ReadToEnd()
            $stderr = $child.StandardError.ReadToEnd()
            $child.WaitForExit()
            if ($stdout) { Write-Host $stdout }
            if ($stderr) { Write-Host $stderr }
            return $child.ExitCode
          }
          $koffiProbe = "import { createRequire } from 'node:module'; import { pathToFileURL } from 'node:url'; const require = createRequire(pathToFileURL(process.argv[1])); const resolved = require.resolve('koffi'); if (!resolved.startsWith(process.argv[2])) throw new Error('koffi resolved outside packaged app: ' + resolved); const koffi = require('koffi'); const getCurrentProcessId = koffi.load('kernel32.dll').func('GetCurrentProcessId', 'uint32', []); if (getCurrentProcessId() !== process.pid) throw new Error('Native koffi smoke failed'); console.log('Packaged koffi native binding passed'); process.exit(0);"
          $koffiExitCode = Invoke-ElectronNode @('--input-type=module', '-e', $koffiProbe, (Join-Path $isolatedApp 'resources\app.asar\node_modules\koffi\package.json'), (Join-Path $isolatedApp 'resources\app.asar\node_modules'))
          if ($koffiExitCode -ne 0) { throw "Packaged koffi native binding failed (exit code $koffiExitCode)." }
          # Packages load through app.asar (native files are unpacked beside it).
          $pnpmEntry = Join-Path $isolatedApp 'resources\app.asar\node_modules\pnpm\bin\pnpm.cjs'
          $pnpmExitCode = Invoke-ElectronNode @($pnpmEntry, '--version')
          if ($pnpmExitCode -ne 0) { throw "Packaged pnpm failed under Electron Node mode (exit code $pnpmExitCode)." }
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }
          $desktop = Start-Process -FilePath $executable -WorkingDirectory $isolatedApp -PassThru `
            -RedirectStandardOutput $desktopStdout -RedirectStandardError $desktopStderr
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $false
            $endpoint = $null
            while ((Get-Date) -lt $deadline) {
              if ($desktop.HasExited) {
                throw "HQHarness Dev exited before Harness was ready (exit code $($desktop.ExitCode))."
              }
              if (Test-Path $logPath) {
                $log = Get-Content -Raw $logPath
                if (-not [string]::IsNullOrEmpty($log)) {
                  $match = [regex]::Match($log, 'dsh web: (http://127\.0\.0\.1:\d+/\?token=[^\s]+)')
                  if ($match.Success) {
                    try {
                      $authenticatedUrl = $match.Groups[1].Value
                      $response = Invoke-WebRequest `
                        -UseBasicParsing `
                        -Uri $authenticatedUrl `
                        -SessionVariable harnessSession `
                        -TimeoutSec 2
                      if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                        $endpoint = ([uri]$authenticatedUrl).GetLeftPart([System.UriPartial]::Authority)
                        $ready = $true
                        break
                      }
                    } catch { }
                  }
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Packaged Harness did not become ready within 75 seconds.' }

            function Invoke-HarnessRpc([string]$endpointName, [hashtable]$request) {
              $rpcId = [guid]::NewGuid().ToString()
              $body = @{
                type = 'client-request'
                rpcId = $rpcId
                method = $endpointName
                payload = @{ args = @{ request = $request } }
              } | ConvertTo-Json -Depth 8 -Compress
              $response = Invoke-RestMethod `
                -Method Post `
                -Uri "$endpoint/api/$endpointName" `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) `
                -WebSession $harnessSession `
                -TimeoutSec 30
              if ($response.rpcId -ne $rpcId) { throw "Harness RPC id mismatch for $endpointName." }
              if (-not $response.result.ok) {
                throw "Harness RPC $endpointName failed: $($response.result.error.code): $($response.result.error.message)"
              }
              return $response.result.value
            }

            $workspacePath = Join-Path $env:RUNNER_TEMP 'HQHarness-工作区'
            New-Item -ItemType Directory -Force -Path $workspacePath | Out-Null
            $workspace = Invoke-HarnessRpc 'workspace/create' @{ path = $workspacePath }
            $session = Invoke-HarnessRpc 'session/create' @{ workspaceId = $workspace.workspace.workspaceId }
            if ([string]::IsNullOrWhiteSpace($session.sessionId)) {
              throw 'Harness did not return a session id for the selected workspace.'
            }

            Start-Sleep -Seconds 20
            $stableLog = Get-Content -Raw $logPath
            $readyMarker = $stableLog.LastIndexOf('[desktop] Harness is ready')
            if ($readyMarker -lt 0) { throw 'Harness readiness marker is missing.' }
            $postReadyLog = $stableLog.Substring($readyMarker)
            if ($postReadyLog -match '\[stderr\]') {
              throw 'Harness reported stderr after becoming ready.'
            }
            if ($stableLog -match '\[node\] Harness process exited') {
              throw 'Harness process exited after workspace and session creation.'
            }
            if ($desktop.HasExited) {
              throw "HQHarness Dev exited after workspace and session creation (exit code $($desktop.ExitCode))."
            }
            Write-Host 'Packaged Windows Harness smoke test passed.'
          } finally {
            foreach ($path in @($desktopStdout, $desktopStderr)) {
              if (Test-Path $path) {
                Write-Host "--- $path ---"
                Get-Content $path
              }
            }
            Get-CimInstance Win32_Process -Filter "name='$($sourceExecutable.Name)'" |
              Select-Object ProcessId, ParentProcessId, CommandLine | Format-List | Out-String | Write-Host
            if (Test-Path $logPath) {
              Write-Host '--- harness.log ---'
              Get-Content $logPath
            }
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
          }
      - name: Archive unpacked Windows release for inner binary signing
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        shell: pwsh
        run: |
          tar -czf dist/win-unpacked.tar.gz -C dist win-unpacked
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        with:
          name: windows-x64-unsigned
          path: |
            dist/hqharness-windows-x64-setup.exe
            dist/win-unpacked.tar.gz
            dist/hqharness-windows-x64-setup.exe.blockmap
            dist/latest.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        with:
          name: windows-x64-dev
          retention-days: 3
          path: |
            dist-dev/hqharness-dev-windows-x64-setup.exe
            dist-dev/hqharness-dev-windows-x64-setup.exe.blockmap
          compression-level: 0
          if-no-files-found: error

  sign-windows:
    name: Sign Windows package with HQHarness UKey
    environment: hqharness-signing
    needs: [validate-dispatch, windows-x64]
    permissions:
      actions: read
      contents: read
    if: >-
      always() &&
      needs.validate-dispatch.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && needs.windows-x64.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'resign' && needs.windows-x64.result == 'skipped'))
    runs-on: [self-hosted, macOS, ARM64, hqharness-signing]
    env:
      CI: 'true'
      JSIGN_VERSION: '7.5'
      JSIGN_SHA256: '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
    steps:
      - uses: actions/checkout@v4
      # The signer only installs release tooling; skip remote npm cache restore.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Prepare HQHarness installer branding
        run: npm run brand:prepare
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.prerelease_tag != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.prerelease_tag }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'resign') && inputs.signed_version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.signed_version }}"
      - name: Prepare unsigned Windows package
        run: |
          work_dir="$RUNNER_TEMP/hqharness-windows-${{ github.run_id }}"
          mkdir -p "$work_dir/release"
          echo "WINDOWS_SIGNING_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
      - name: Bypass runner proxy for artifact transfer
        run: |
          # The runner exports lowercase proxy variables separately on macOS.
          # A step env map cannot specify both cases in GitHub workflow YAML.
          printf 'http_proxy=\nhttps_proxy=\nall_proxy=\nno_proxy=*\n' >> "$GITHUB_ENV"
      - name: Download verified Windows signing inputs in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.mode == 'resign' && inputs.unsigned_run_id || github.run_id }}
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          node scripts/download-artifact-ranges.mjs "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" \
            windows-x64-unsigned "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip"
          unzip -q "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip" -d "$WINDOWS_SIGNING_WORK_DIR/release"
          rm "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip"
      - name: Extract and verify unsigned Windows application
        env:
          XASP_EXPECTED: ${{ inputs.xasp_bundle && '1' || '' }}
        run: |
          set -euo pipefail
          test -s "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz"
          tar -xzf "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz" -C "$WINDOWS_SIGNING_WORK_DIR/release"
          node <<'NODE'
          const { join } = require('node:path')
          const { extractFile } = require('@electron/asar')
          const expected = require('./package.json')
          const archive = join(process.env.WINDOWS_SIGNING_WORK_DIR, 'release', 'win-unpacked', 'resources', 'app.asar')
          const actual = JSON.parse(extractFile(archive, 'package.json').toString('utf8'))
          for (const field of ['name', 'productName', 'version']) {
            if (typeof actual[field] !== 'string' || actual[field] !== expected[field]) {
              throw new Error(`Unsigned Windows application ${field} ${JSON.stringify(actual[field])} does not match expected ${JSON.stringify(expected[field])}`)
            }
          }
          console.log(`Verified unsigned Windows application ${actual.productName} ${actual.version}`)
          NODE
          node .github/scripts/xasp-ci.mjs verify-windows-signing-input "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked/resources"
      - name: Download and verify Jsign
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jsign_jar="$WINDOWS_SIGNING_WORK_DIR/jsign-${JSIGN_VERSION}.jar"
          gh release download "$JSIGN_VERSION" --repo ebourg/jsign \
            --pattern "jsign-${JSIGN_VERSION}.jar" --dir "$WINDOWS_SIGNING_WORK_DIR" --clobber
          test -s "$jsign_jar"
          printf '%s  %s\n' "$JSIGN_SHA256" "$jsign_jar" | shasum -a 256 --check
          java -jar "$jsign_jar" --version
          echo "JSIGN_JAR=$jsign_jar" >> "$GITHUB_ENV"
      - name: Sign Windows installer with SafeNet UKey
        env:
          WINDOWS_SIGNING_PIN: ${{ secrets.HQHARN_WINDOWS_SIGNING_PIN }}
        run: |
          set -euo pipefail
          test -r /usr/local/lib/libeTPkcs11.dylib
          test -n "$WINDOWS_SIGNING_PIN" || { echo "::error::Missing required secret: HQHARN_WINDOWS_SIGNING_PIN"; exit 1; }
          pin_file="$(mktemp "$WINDOWS_SIGNING_WORK_DIR/jsign-pin.XXXXXX")"
          trap 'rm -f "$pin_file"' EXIT
          chmod 600 "$pin_file"
          printf '%s' "$WINDOWS_SIGNING_PIN" > "$pin_file"
          unset WINDOWS_SIGNING_PIN

          # Only the application extracted and verified above may be signed.
          JSIGN_JAR="$JSIGN_JAR" JSIGN_PIN_FILE="$pin_file" \
            node scripts/sign-windows-unpacked.mjs "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked"
          rm -f "$WINDOWS_SIGNING_WORK_DIR/release"/*.exe "$WINDOWS_SIGNING_WORK_DIR/release"/*.blockmap
          JSIGN_JAR="$JSIGN_JAR" JSIGN_PIN_FILE="$pin_file" \
            node scripts/electron-builder-windows.mjs --win --x64 --publish never \
            --prepackaged "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked" \
            --config.directories.output="$WINDOWS_SIGNING_WORK_DIR/release"
          rm -rf "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked" "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz"

          installer_count="$(find "$WINDOWS_SIGNING_WORK_DIR/release" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')"
          test "$installer_count" = '1'
          installer="$(find "$WINDOWS_SIGNING_WORK_DIR/release" -maxdepth 1 -type f -name '*.exe' -print -quit)"
          java -jar "$JSIGN_JAR" \
            --storetype ETOKEN \
            --storepass "file:$pin_file" \
            --alg SHA-256 \
            --tsaurl http://timestamp.digicert.com \
            --tsmode RFC3161 \
            --tsretries 3 \
            --tsretrywait 10 \
            --name 'HQHarness' \
            --verbose \
            "$installer"
          java -jar "$JSIGN_JAR" extract --format DER "$installer"
          test -s "$installer.sig"
          rm -f "$installer.sig"
      - name: Rebuild Windows update metadata
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          SIGNED_VERSION: ${{ inputs.signed_version }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          # Tag pushes use the git tag. Dispatch must not fall back to the
          # branch name, because finalize-windows-release.mjs requires semver.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$DISPATCH_MODE" = "prerelease" ]; then
            version="${PRERELEASE_TAG#v}"
          else
            version="${SIGNED_VERSION#v}"
          fi
          node scripts/finalize-windows-release.mjs \
            "$WINDOWS_SIGNING_WORK_DIR/release" \
            "$version"
          test -f "$WINDOWS_SIGNING_WORK_DIR/release/latest.yml"
          test -f "$WINDOWS_SIGNING_WORK_DIR"/release/*.exe.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          retention-days: 7
          path: |
            ${{ runner.temp }}/hqharness-windows-${{ github.run_id }}/release/Huaqing-Desktop-*.exe
            ${{ runner.temp }}/hqharness-windows-${{ github.run_id }}/release/Huaqing-Desktop-*.exe.blockmap
            ${{ runner.temp }}/hqharness-windows-${{ github.run_id }}/release/latest.yml
          compression-level: 0
          if-no-files-found: error
      - name: Remove local signing files
        if: always()
        run: |
          case "$WINDOWS_SIGNING_WORK_DIR" in
            "$RUNNER_TEMP"/hqharness-windows-*) rm -rf "$WINDOWS_SIGNING_WORK_DIR" ;;
            '') ;;
            *) echo "Refusing to remove unexpected signing path: $WINDOWS_SIGNING_WORK_DIR"; exit 1 ;;
          esac

  smoke-signed-windows:
    name: Smoke final signed Windows installer
    needs: sign-windows
    if: needs.sign-windows.result == 'success'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: inputs.xasp_bundle
        with:
          node-version: 24
      - if: inputs.xasp_bundle
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: signed-windows
      - name: Verify signed installation and upgrade
        env:
          HQHARN_WINDOWS_PUBLISHER_NAME: ${{ vars.HQHARN_WINDOWS_PUBLISHER_NAME }}
          VERIFY_XASP: ${{ inputs.xasp_bundle && '1' || '' }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem signed-windows -File -Filter 'Huaqing-Desktop-*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one final Windows installer.' }
          ./scripts/smoke-signed-windows-installer.ps1 `
            -Installer $installers[0].FullName `
            -PublisherName $env:HQHARN_WINDOWS_PUBLISHER_NAME `
            -VerifyXasp:($env:VERIFY_XASP -eq '1')

  smoke-existing-signed-windows:
    name: Recheck existing signed Windows installer
    needs: validate-dispatch
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke'
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: signed-windows
          run-id: ${{ inputs.smoke_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed installation and upgrade
        env:
          HQHARN_WINDOWS_PUBLISHER_NAME: ${{ vars.HQHARN_WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem signed-windows -File -Filter 'Huaqing-Desktop-*.exe')
          if ($installers.Count -eq 0) {
            $installers = @(Get-ChildItem signed-windows -File -Filter 'hqharness-windows-x64-setup.exe')
          }
          if ($installers.Count -ne 1) { throw 'Expected exactly one final Windows installer.' }
          ./scripts/smoke-signed-windows-installer.ps1 `
            -Installer $installers[0].FullName `
            -PublisherName $env:HQHARN_WINDOWS_PUBLISHER_NAME

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.prerelease_tag == '' &&
      needs.macos.result == 'success' &&
      needs.sign-windows.result == 'success' &&
      needs.smoke-signed-windows.result == 'success'
    needs:
      - macos
      - sign-windows
      - smoke-signed-windows
    runs-on: ubuntu-24.04
    environment: hqharness-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          if [ -f release-assets/latest-mac-arm64.yml ] || [ -f release-assets/latest-mac-x64.yml ]; then
            node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          fi
          find release-assets -maxdepth 1 \
            \( -name latest-mac-arm64.yml -o -name latest-mac-x64.yml \) \
            -delete
      - name: Verify release assets before publication
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.mjs release-assets "${GITHUB_REF_NAME#v}"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "HQHarness $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish-prerelease:
    name: Publish GitHub Pre-release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'prerelease' &&
      inputs.target == 'all' &&
      inputs.prerelease_tag != '' &&
      needs.macos.result == 'success' &&
      needs.sign-windows.result == 'success' &&
      needs.smoke-signed-windows.result == 'success'
    needs:
      - macos
      - sign-windows
      - smoke-signed-windows
    runs-on: ubuntu-24.04
    environment: hqharness-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          if [ -f release-assets/latest-mac-arm64.yml ] || [ -f release-assets/latest-mac-x64.yml ]; then
            node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          fi
          find release-assets -maxdepth 1 \
            \( -name latest-mac-arm64.yml -o -name latest-mac-x64.yml \) \
            -delete
      - name: Verify release assets before publication
        run: node scripts/verify-release-assets.mjs release-assets "${{ inputs.prerelease_tag }}"
      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.prerelease_tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          VERIFY_XASP_PRIVATE_DESTINATION: ${{ inputs.xasp_bundle && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_XASP_PRIVATE_DESTINATION" = '1' ]; then
            node .github/scripts/xasp-ci.mjs verify-private-release
          fi
          if existing_prerelease=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null); then
            if [ "$VERIFY_XASP_PRIVATE_DESTINATION" = '1' ] && [ "$existing_prerelease" != 'true' ]; then
              echo '::error::XASP artifacts may only be added to an existing prerelease.'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "HQHarness $RELEASE_TAG（预发布）" \
              --repo "$GITHUB_REPOSITORY"
          fi
